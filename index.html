<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>antareti — OSINT & Automation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --accent: #ff0000;
            --text-main: #ffffff;
            --border: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            transition: background 1s ease;
        }

        /* --- АНИМАЦИЯ БЕСКОНЕЧНОГО ВРАЩЕНИЯ --- */
        .black-hole-active {
            animation: collapse-spin 4s infinite linear !important;
            filter: hue-rotate(90deg) contrast(150%) !important;
            pointer-events: none; /* Отключаем клики во время хаоса */
            overflow: hidden;
        }

        @keyframes collapse-spin {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(0.5) rotate(1800deg); filter: blur(5px) invert(1); }
            100% { transform: scale(1) rotate(3600deg); }
        }

        /* --- СТИЛИ САЙТА --- */
        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            border-bottom: 1px solid var(--border);
        }

        .hero h1 { font-size: clamp(3rem, 10vw, 6rem); font-weight: 900; text-transform: uppercase; line-height: 0.9; }
        .hero h1 span { color: var(--accent); }

        .activate-btn {
            margin-top: 30px;
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 15px 30px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
            transition: 0.3s;
            width: fit-content;
        }

        .activate-btn:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 30px var(--accent);
        }

        #repos-list { padding: 50px 10%; }
        .repo-item {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .repo-name { font-size: 1.5rem; font-weight: 700; text-transform: uppercase; }

        footer { padding: 50px; text-align: center; opacity: 0.5; font-size: 0.8rem; }

        /* Сообщение при коллапсе */
        #warning {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent);
            font-weight: 900;
            font-size: 2rem;
            z-index: 1000;
            text-align: center;
            text-shadow: 0 0 20px var(--accent);
        }
    </style>
</head>
<body>

    <div id="warning">SYSTEM COLLAPSED<br>SINGULARITY REACHED</div>

    <div id="content-to-spin">
        <section class="hero">
            <p style="color: var(--accent); font-family: monospace;">STATUS: ONLINE</p>
            <h1>PYTHON<br><span>SYSTEMS</span></h1>
            <button class="activate-btn" onclick="startSingularity()">Initialize Black Hole</button>
        </section>

        <div id="repos-list">
            <div class="repo-item"><div class="repo-name">OSINT_TOOL_V1</div><span style="color: var(--accent);">+</span></div>
            <div class="repo-item"><div class="repo-name">AUTO_DB_RECON</div><span style="color: var(--accent);">+</span></div>
            <div class="repo-item"><div class="repo-name">SHADOW_SCANNER</div><span style="color: var(--accent);">+</span></div>
        </div>

        <footer>© 2026 ANTARETI // NO WAY BACK</footer>
    </div>

    <script>
        function startSingularity() {
            // 1. Находим весь контент
            const content = document.getElementById('content-to-spin');
            const warning = document.getElementById('warning');
            
            // 2. Добавляем класс безумного вращения
            content.classList.add('black-hole-active');
            
            // 3. Показываем текст предупреждения
            warning.style.display = 'block';

            // 4. Меняем фон страницы
            document.body.style.backgroundColor = '#050000';
            
            console.log("Black Hole Initialized. Gravity is now infinite.");
        }
    </script>
</body>
</html>
