<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>antareti — OSINT & Automation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --accent: #ff0000;
            --text-main: #ffffff;
            --text-dim: #888888;
            --border: #1a1a1a;
            --hover-bg: #050505;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Hero Section */
        .hero {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            border-bottom: 1px solid var(--border);
        }

        .hero-label {
            color: var(--accent);
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .hero h1 {
            font-size: clamp(3rem, 12vw, 7rem);
            font-weight: 900;
            line-height: 0.85;
            text-transform: uppercase;
            letter-spacing: -3px;
        }

        .hero h1 span {
            color: var(--accent);
            display: block;
        }

        /* Phases Container */
        .phases-wrapper {
            width: 100%;
        }

        .phase-item {
            border-bottom: 1px solid var(--border);
            transition: background 0.3s ease;
        }

        .phase-header {
            padding: 45px 10%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .phase-header:hover {
            background-color: var(--hover-bg);
        }

        .phase-info {
            display: flex;
            align-items: baseline;
            gap: 40px;
        }

        .phase-number {
            color: var(--accent);
            font-size: 1.2rem;
            font-weight: 700;
            font-family: monospace;
        }

        .phase-title {
            font-size: clamp(1.5rem, 5vw, 3rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .phase-icon {
            font-size: 2.5rem;
            color: var(--accent);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 300;
        }

        /* Content (Accordion behavior) */
        .phase-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1), padding 0.6s;
            padding: 0 10%;
            background-color: var(--hover-bg);
        }

        .phase-item.active .phase-content {
            max-height: 800px;
            padding-bottom: 60px;
        }

        .phase-item.active .phase-icon {
            transform: rotate(45deg);
        }

        /* Repo Details inside Phases */
        .repo-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            border-left: 1px solid var(--accent);
            padding-left: 30px;
        }

        .repo-description {
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-bottom: 20px;
            max-width: 600px;
        }

        .repo-stats {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
        }

        .repo-btn {
            display: inline-block;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px 35px;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .repo-btn:hover {
            background: var(--accent);
            color: white;
        }

        #status-msg {
            padding: 40px 10%;
            color: var(--accent);
            font-family: monospace;
            font-size: 1.2rem;
        }

        footer {
            padding: 80px 10%;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-dim);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <section class="hero">
        <p class="hero-label">Добрый Хакер // 2026[cite: 1]</p>
        <h1>PYTHON<br><span>SYSTEMS</span></h1>
    </section>

    <div id="status-msg">ИНИЦИАЛИЗАЦИЯ GITHUB API...</div>
    
    <div class="phases-wrapper" id="repos-list">
        <!-- Репозитории загрузятся сюда -->
    </div>

    <footer>
        © 2026 ANTARETI[cite: 1]. ВСЕ ПРАВА ЗАЩИЩЕНЫ.
    </footer>

    <script>
        const USER = 'antareti';

        async function loadRepos() {
            const list = document.getElementById('repos-list');
            const msg = document.getElementById('status-msg');

            try {
                const response = await fetch(`https://api.github.com/users/${USER}/repos?sort=updated&per_page=100`);
                if (!response.ok) throw new Error('Ошибка доступа');
                const repos = await response.json();

                msg.style.display = 'none';

                repos.forEach((repo, index) => {
                    const phaseNum = (index + 1).toString().padStart(2, '0');
                    const desc = repo.description || "Документация проекта находится в процессе обновления[cite: 1].";
                    const lang = repo.language || "Python";

                    const html = `
                        <div class="phase-item">
                            <div class="phase-header">
                                <div class="phase-info">
                                    <span class="phase-number">${phaseNum}</span>
                                    <h2 class="phase-title">${repo.name}</h2>
                                </div>
                                <div class="phase-icon">+</div>
                            </div>
                            <div class="phase-content">
                                <div class="repo-meta">
                                    <div>
                                        <p class="repo-description">${desc}</p>
                                        <div class="repo-stats">
                                            <span>Язык: ${lang}</span>
                                            <span>Обновлено: ${new Date(repo.updated_at).toLocaleDateString()}</span>
                                        </div>
                                        <a href="${repo.html_url}" target="_blank" class="repo-btn">Смотреть код</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    list.innerHTML += html;
                });

                initAccordion();

            } catch (err) {
                msg.innerText = 'ОШИБКА: НЕ УДАЛОСЬ ПОЛУЧИТЬ ДАННЫЕ.';
                console.error(err);
            }
        }

        function initAccordion() {
            document.querySelectorAll('.phase-header').forEach(header => {
                header.addEventListener('click', () => {
                    const item = header.parentElement;
                    const isActive = item.classList.contains('active');

                    // Закрываем все остальные фазы
                    document.querySelectorAll('.phase-item').forEach(el => el.classList.remove('active'));

                    // Если кликнутый не был активен — открываем
                    if (!isActive) {
                        item.classList.add('active');
                    }
                });
            });
        }

        loadRepos();
    </script>
</body>
</html>
