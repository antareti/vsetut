<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>antareti — OSINT & Automation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --accent: #ff0000;
            --text-main: #ffffff;
            --text-dim: #888888;
            --border: #1a1a1a;
            --hover-bg: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden; /* Скрываем прокрутку для чистого эффекта */
            -webkit-font-smoothing: antialiased;
        }

        /* КОНТЕЙНЕР ДЛЯ ВИДЕО */
        #video-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
        }

        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* КНОПКА ЗАКРЫТИЯ (ПО ЖЕЛАНИЮ) */
        .close-video {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,0,0,0.5);
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-family: monospace;
            z-index: 10000;
            text-transform: uppercase;
        }

        /* ОСНОВНОЙ КОНТЕНТ */
        #main-content {
            transition: opacity 1s ease, transform 1.5s ease;
            width: 100%;
            height: 100vh;
            overflow-y: auto;
        }

        .hero {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            border-bottom: 1px solid var(--border);
        }

        .hero-label { color: var(--accent); font-family: monospace; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1rem; }
        .hero h1 { font-size: clamp(3rem, 12vw, 7rem); font-weight: 900; line-height: 0.85; text-transform: uppercase; letter-spacing: -3px; }
        .hero h1 span { color: var(--accent); display: block; }

        .activate-btn {
            margin-top: 30px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px 25px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .activate-btn:hover { background: var(--accent); color: white; box-shadow: 0 0 20px var(--accent); }

        .phases-wrapper { width: 100%; }
        .phase-item { border-bottom: 1px solid var(--border); transition: 0.3s; }
        .phase-header { padding: 45px 10%; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .phase-header:hover { background: var(--hover-bg); }
        .phase-info { display: flex; align-items: baseline; gap: 40px; }
        .phase-number { color: var(--accent); font-weight: 700; font-family: monospace; }
        .phase-title { font-size: clamp(1.5rem, 5vw, 3rem); font-weight: 900; text-transform: uppercase; }
        .phase-icon { font-size: 2.5rem; color: var(--accent); transition: 0.5s; }
        .phase-content { max-height: 0; overflow: hidden; transition: 0.6s; padding: 0 10%; background-color: var(--hover-bg); }
        .phase-item.active .phase-content { max-height: 800px; padding-bottom: 60px; }
        .phase-item.active .phase-icon { transform: rotate(45deg); }
        
        #status-msg { padding: 40px 10%; color: var(--accent); font-family: monospace; }
        footer { padding: 80px 10%; text-align: center; color: var(--text-dim); font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- ПОЛНОЭКРАННОЕ ВИДЕО -->
    <div id="video-container">
        <button class="close-video" onclick="location.reload()">[ EXIT ]</button>
        <video id="myVideo" src="8.mp4" preload="auto"></video>
    </div>

    <div id="main-content">
        <section class="hero">
            <p class="hero-label">Добрый Хакер // 2026</p>
            <h1>PYTHON<br><span>SYSTEMS</span></h1>
            <button class="activate-btn" onclick="playSecretVideo()">Initialize Breach</button>
        </section>

        <div id="status-msg">ИНИЦИАЛИЗАЦИЯ GITHUB API...</div>
        <div class="phases-wrapper" id="repos-list"></div>

        <footer>© 2026 ANTARETI. ВСЕ ПРАВА ЗАЩИЩЕНЫ.</footer>
    </div>

    <script>
        const USER = 'antareti';

        function playSecretVideo() {
            const content = document.getElementById('main-content');
            const videoCont = document.getElementById('video-container');
            const video = document.getElementById('myVideo');

            // Исчезновение сайта
            content.style.opacity = '0';
            content.style.transform = 'scale(1.1)';

            setTimeout(() => {
                content.style.display = 'none';
                videoCont.style.display = 'block';
                video.play(); // Запуск видео
            }, 1000);
        }

        async function loadRepos() {
            const list = document.getElementById('repos-list');
            const msg = document.getElementById('status-msg');
            try {
                const response = await fetch(`https://api.github.com/users/${USER}/repos?sort=updated&per_page=100`);
                const repos = await response.json();
                
                msg.style.display = 'none';
                repos.forEach((repo, index) => {
                    const phaseNum = (index + 1).toString().padStart(2, '0');
                    list.innerHTML += `
                        <div class="phase-item">
                            <div class="phase-header">
                                <div class="phase-info">
                                    <span class="phase-number">${phaseNum}</span>
                                    <h2 class="phase-title">${repo.name}</h2>
                                </div>
                                <div class="phase-icon">+</div>
                            </div>
                            <div class="phase-content">
                                <p style="color: var(--text-dim); margin-bottom: 20px;">${repo.description || "Описание отсутствует."}</p>
                                <a href="${repo.html_url}" target="_blank" style="color: var(--accent); text-decoration: none; font-weight: bold;">[ ИСХОДНЫЙ КОД ]</a>
                            </div>
                        </div>`;
                });

                document.querySelectorAll('.phase-header').forEach(h => {
                    h.onclick = () => {
                        const item = h.parentElement;
                        const wasActive = item.classList.contains('active');
                        document.querySelectorAll('.phase-item').forEach(el => el.classList.remove('active'));
                        if (!wasActive) item.classList.add('active');
                    };
                });
            } catch (e) {
                msg.innerText = 'ОШИБКА GITHUB API';
            }
        }
        loadRepos();
    </script>
</body>
</html>
