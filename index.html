<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>antareti — OSINT & Automation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --accent: #ff0000;
            --text-main: #ffffff;
            --text-dim: #888888;
            --border: #1a1a1a;
            --hover-bg: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: transform 1.5s cubic-bezier(0.7, 0, 0.3, 1), filter 1.5s;
        }

        /* Эффект засасывания для всего тела */
        body.collapsing {
            transform: scale(0) rotate(720deg);
            filter: blur(10px);
            pointer-events: none;
        }

        .hero {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            border-bottom: 1px solid var(--border);
        }

        .hero-label { color: var(--accent); font-family: monospace; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1rem; }
        .hero h1 { font-size: clamp(3rem, 12vw, 7rem); font-weight: 900; line-height: 0.85; text-transform: uppercase; letter-spacing: -3px; }
        .hero h1 span { color: var(--accent); display: block; }

        .activate-btn {
            margin-top: 30px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px 25px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 700;
            width: fit-content;
            transition: 0.3s;
            z-index: 10;
        }

        .activate-btn:hover { background: var(--accent); color: white; box-shadow: 0 0 20px var(--accent); }

        /* РЕАЛЬНАЯ ЧЕРНАЯ ДЫРА */
        #black-hole-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a0000 0%, #000 70%);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .bh-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Тень/Горизонт событий */
        .bh-shadow {
            position: absolute;
            width: 150px;
            height: 150px;
            background: #000;
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 0 50px 10px #000, 0 0 20px 2px var(--accent);
        }

        /* Аккреционный диск (красное кольцо) */
        .bh-disk {
            position: absolute;
            width: 100%;
            height: 40%;
            border-radius: 50%;
            background: linear-gradient(90deg, transparent, var(--accent), #ff6600, var(--accent), transparent);
            filter: blur(5px);
            animation: rotateDisk 2s infinite linear;
            box-shadow: 0 0 40px var(--accent);
            transform: rotateX(70deg);
        }

        /* Искажение пространства */
        .bh-distortion {
            position: absolute;
            width: 350px;
            height: 350px;
            border: 2px solid rgba(255, 0, 0, 0.1);
            border-radius: 45%;
            animation: rotateDistort 10s infinite linear;
        }

        @keyframes rotateDisk {
            from { transform: rotateX(70deg) rotateZ(0deg); }
            to { transform: rotateX(70deg) rotateZ(360deg); }
        }

        @keyframes rotateDistort {
            from { transform: rotate(0deg) scale(1); }
            to { transform: rotate(360deg) scale(1.1); }
        }

        .bh-text {
            position: absolute;
            bottom: 10%;
            text-align: center;
            width: 100%;
            color: var(--accent);
            font-family: monospace;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /* Остальные стили сайта */
        .phases-wrapper { width: 100%; }
        .phase-item { border-bottom: 1px solid var(--border); }
        .phase-header { padding: 45px 10%; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .phase-info { display: flex; align-items: baseline; gap: 40px; }
        .phase-number { color: var(--accent); font-weight: 700; font-family: monospace; }
        .phase-title { font-size: clamp(1.5rem, 5vw, 3rem); font-weight: 900; text-transform: uppercase; }
        .phase-icon { font-size: 2.5rem; color: var(--accent); transition: 0.5s; }
        .phase-content { max-height: 0; overflow: hidden; transition: 0.6s; padding: 0 10%; background-color: var(--hover-bg); }
        .phase-item.active .phase-content { max-height: 800px; padding-bottom: 60px; }
        .phase-item.active .phase-icon { transform: rotate(45deg); }
        .repo-meta { border-left: 1px solid var(--accent); padding-left: 30px; }
        .repo-description { color: var(--text-dim); margin-bottom: 20px; }
        .repo-btn { display: inline-block; border: 1px solid var(--accent); color: var(--accent); padding: 12px 35px; text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: 0.9rem; }
        #status-msg { padding: 40px 10%; color: var(--accent); font-family: monospace; }
        footer { padding: 80px 10%; text-align: center; color: var(--text-dim); font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="main-content">
        <section class="hero">
            <p class="hero-label">Добрый Хакер // 2026</p>
            <h1>PYTHON<br><span>SYSTEMS</span></h1>
            <button class="activate-btn" onclick="go4()">Initialize Black Hole</button>
        </section>

        <div id="status-msg">ИНИЦИАЛИЗАЦИЯ GITHUB API...</div>
        <div class="phases-wrapper" id="repos-list"></div>

        <footer>© 2026 ANTARETI. ВСЕ ПРАВА ЗАЩИЩЕНЫ.</footer>
    </div>

    <!-- ЭКРАН ЧЕРНОЙ ДЫРЫ -->
    <div id="black-hole-overlay">
        <div class="bh-container">
            <div class="bh-distortion"></div>
            <div class="bh-disk"></div>
            <div class="bh-shadow"></div>
        </div>
        <div class="bh-text">
            <h2>SINGULARITY ACHIEVED</h2>
            <p style="margin-top: 15px; letter-spacing: 1px; color: #fff;">System collapsed into the void</p>
            <button class="activate-btn" onclick="location.reload()" style="margin-top: 30px;">Restore Reality</button>
        </div>
    </div>

    <script>
        const USER = 'antareti';

        function go4() {
            // 1. Запускаем анимацию "схлопывания" основного сайта
            document.body.classList.add('collapsing');
            
            // 2. Через секунду показываем черную дыру
            setTimeout(() => {
                const overlay = document.getElementById('black-hole-overlay');
                overlay.style.display = 'flex';
                setTimeout(() => {
                    overlay.style.opacity = '1';
                }, 50);
            }, 1000);
        }

        async function loadRepos() {
            const list = document.getElementById('repos-list');
            const msg = document.getElementById('status-msg');
            try {
                const response = await fetch(`https://api.github.com/users/${USER}/repos?sort=updated&per_page=100`);
                const repos = await response.json();
                msg.style.display = 'none';
                repos.forEach((repo, index) => {
                    const phaseNum = (index + 1).toString().padStart(2, '0');
                    list.innerHTML += `
                        <div class="phase-item">
                            <div class="phase-header">
                                <div class="phase-info">
                                    <span class="phase-number">${phaseNum}</span>
                                    <h2 class="phase-title">${repo.name}</h2>
                                </div>
                                <div class="phase-icon">+</div>
                            </div>
                            <div class="phase-content">
                                <div class="repo-meta">
                                    <p class="repo-description">${repo.description || "Project documentation pending."}</p>
                                    <a href="${repo.html_url}" target="_blank" class="repo-btn">Source Code</a>
                                </div>
                            </div>
                        </div>`;
                });
                document.querySelectorAll('.phase-header').forEach(h => {
                    h.onclick = () => h.parentElement.classList.toggle('active');
                });
            } catch (e) { msg.innerText = 'ОШИБКА API'; }
        }
        loadRepos();
    </script>
</body>
</html>
