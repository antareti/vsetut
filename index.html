<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>antareti — OSINT & Automation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --accent: #ff0000;
            --text-main: #ffffff;
            --text-dim: #888888;
            --border: #1a1a1a;
            --hover-bg: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            /* Плавный переход для фильтров */
            transition: filter 2s ease;
        }

        /* КЛАСС ДЛЯ БЕСКОНЕЧНОГО ВРАЩЕНИЯ */
        .infinite-spin {
            animation: spin-forever 3s infinite linear;
            filter: blur(1px) hue-rotate(10deg);
            pointer-events: none; /* Чтобы кнопки нельзя было нажать во время вращения */
            transform-origin: center center;
            position: fixed;
            width: 100%;
        }

        @keyframes spin-forever {
            from { transform: scale(1) rotate(0deg); }
            to { transform: scale(0.1) rotate(3600deg); } /* Сжимается и делает 10 оборотов за цикл */
        }

        .hero {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            border-bottom: 1px solid var(--border);
        }

        .hero-label { color: var(--accent); font-family: monospace; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 1rem; }
        .hero h1 { font-size: clamp(3rem, 12vw, 7rem); font-weight: 900; line-height: 0.85; text-transform: uppercase; letter-spacing: -3px; }
        .hero h1 span { color: var(--accent); display: block; }

        .activate-btn {
            margin-top: 30px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 12px 25px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 700;
            transition: 0.3s;
        }

        .activate-btn:hover { background: var(--accent); color: white; box-shadow: 0 0 20px var(--accent); }

        .phases-wrapper { width: 100%; }
        .phase-item { border-bottom: 1px solid var(--border); }
        .phase-header { padding: 45px 10%; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .phase-info { display: flex; align-items: baseline; gap: 40px; }
        .phase-number { color: var(--accent); font-weight: 700; font-family: monospace; }
        .phase-title { font-size: clamp(1.5rem, 5vw, 3rem); font-weight: 900; text-transform: uppercase; }
        .phase-icon { font-size: 2.5rem; color: var(--accent); transition: 0.5s; }
        .phase-content { max-height: 0; overflow: hidden; transition: 0.6s; padding: 0 10%; background-color: var(--hover-bg); }
        .phase-item.active .phase-content { max-height: 800px; padding-bottom: 60px; }
        .phase-item.active .phase-icon { transform: rotate(45deg); }
        
        #status-msg { padding: 40px 10%; color: var(--accent); font-family: monospace; }
        footer { padding: 80px 10%; text-align: center; color: var(--text-dim); font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- Обертка, которую мы будем крутить -->
    <div id="app-wrapper">
        <section class="hero">
            <p class="hero-label">Добрый Хакер // 2026</p>
            <h1>PYTHON<br><span>SYSTEMS</span></h1>
            <button class="activate-btn" onclick="startInfiniteSpin()">Initialize Singularity</button>
        </section>

        <div id="status-msg">ИНИЦИАЛИЗАЦИЯ GITHUB API...</div>
        <div class="phases-wrapper" id="repos-list"></div>

        <footer>© 2026 ANTARETI. ВСЕ ПРАВА ЗАЩИЩЕНЫ.</footer>
    </div>

    <script>
        const USER = 'antareti';

        // ТА САМАЯ ФУНКЦИЯ БЕСКОНЕЧНОГО ВРАЩЕНИЯ
        function startInfiniteSpin() {
            const wrapper = document.getElementById('app-wrapper');
            wrapper.classList.add('infinite-spin');
            
            // Опционально: меняем фон на более глубокий красный
            document.body.style.backgroundColor = '#1a0000';
        }

        async function loadRepos() {
            const list = document.getElementById('repos-list');
            const msg = document.getElementById('status-msg');
            try {
                const response = await fetch(`https://api.github.com/users/${USER}/repos?sort=updated&per_page=100`);
                const repos = await response.json();
                msg.style.display = 'none';
                repos.forEach((repo, index) => {
                    const phaseNum = (index + 1).toString().padStart(2, '0');
                    list.innerHTML += `
                        <div class="phase-item">
                            <div class="phase-header">
                                <div class="phase-info">
                                    <span class="phase-number">${phaseNum}</span>
                                    <h2 class="phase-title">${repo.name}</h2>
                                </div>
                                <div class="phase-icon">+</div>
                            </div>
                            <div class="phase-content">
                                <p style="padding: 20px 0; color: var(--text-dim)">${repo.description || "No description provided."}</p>
                            </div>
                        </div>`;
                });
                document.querySelectorAll('.phase-header').forEach(h => {
                    h.onclick = () => h.parentElement.classList.toggle('active');
                });
            } catch (e) { msg.innerText = 'ОШИБКА API'; }
        }
        loadRepos();
    </script>
</body>
</html>
